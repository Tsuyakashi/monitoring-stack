log_format json_combined escape=json '{"time":"$time_iso8601","method":"$request_method","uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,"ip":"$remote_addr"}';

upstream kibana_backend {
    server kibana:5601;
}

server {
    listen 80;
    
    access_log /dev/stdout json_combined;
    
    location /python/ { 
        proxy_pass http://python-app:8080/; 
    }

    
    location /kibana/ {
        proxy_pass http://kibana_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
