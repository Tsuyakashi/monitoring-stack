input {
  beats {
    port => 5044
  }
}

filter {
  # Prevent memory leak from huge logs
  truncate {
    length_bytes => 1000000  # 1MB max
  }

  if [container][name] == "nginx-proxy" {
    json {
      source => "message"
      target => "nginx"
      tag_on_failure => ["_nginx_json_parse_failure"]
    }
    
    if "_nginx_json_parse_failure" not in [tags] {
      mutate {
        add_field => { "[@metadata][target_index]" => "nginx-logs" }
        convert   => { "[nginx][status]" => "integer" }
        convert   => { "[nginx][bytes]"  => "integer" }
        remove_field => ["message"]
      }
    } else {
      # Handle JSON parse failures for nginx
      mutate {
        add_field => { "[@metadata][target_index]" => "nginx-logs-error" }
        add_field => { "parse_error" => true }
      }
    }
  } else {
    mutate { add_field => { "[@metadata][target_index]" => "apps-logs" } }
    
    json {
      source       => "message"
      target       => "app"
      tag_on_failure => ["_json_parse_failure"]
    }
    
    if "_json_parse_failure" in [tags] {
      mutate {
        add_field => { "parse_error" => true }
      }
    }
  }

  mutate {
    remove_field => ["host", "agent", "ecs", "input", "event"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "%{[@metadata][target_index]}-%{+YYYY.MM.dd}"
    manage_template => false
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    retry_on_conflict => 1
  }
}
